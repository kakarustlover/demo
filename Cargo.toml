[package]
name = "liquid_demo"
version = "0.1.0"
edition = "2024"
rust-version = "1.99"

[lib]
crate-type = ["cdylib"]

[dependencies]
liquid-rust = "0.1"
wgpu = "30"
winit = { version = "0.30", default-features = false, features = ["android-native-activity", "rwh_06"] }
pollster = "1"
bytemuck = { version = "1", features = ["derive"] }
log = "0.4"
android_logger = "0.15"

[profile.release]
opt-level = 3
lto = "thin"
